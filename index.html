<!doctype html>
<html lang="uz">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#4f46e5" />
    <meta name="description" content="StokPilot — ombor va sotuv, internetsiz ham nazoratda." />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" type="image/png" href="/icon-192.png" />
    <link rel="apple-touch-icon" href="/icon-192.png" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <title>StokPilot</title>
    <script>
      // Anti-flash: apply persisted theme before first paint
      try {
        var raw = localStorage.getItem('sp-settings');
        var s = raw ? JSON.parse(raw).state : null;
        var t = s && s.theme;
        var dark = t === 'dark' || ((t !== 'light') && window.matchMedia('(prefers-color-scheme: dark)').matches);
        if (dark) document.documentElement.classList.add('dark');
        if (s && s.accent) document.documentElement.style.setProperty('--accent', ({indigo:'#4f46e5',emerald:'#059669',sky:'#0284c7',amber:'#d97706',rose:'#e11d48',violet:'#7c3aed',teal:'#0d9488'})[s.accent] || '#4f46e5');
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
